<meta charset="UTF-8">

<title>Yoda Research · 會員報告</title>
<!--
  報告頁「空殼」範本 · 對應 subscribe §8-P1
  這個檔本身【不含任何付費正文】——只有密碼框、空容器、JS。
  讀者輸入密碼 → 打 GAS getReport 驗證 → 通過才把正文從後端載進 iframe。
  所以盜傳者存檔／看原始碼，只會拿到這個空殼。
  用法：把付費正文放進 GAS 設定的私有 Drive 資料夾，檔名 <id>.html；
       報告連結長這樣：report-shell.html?id=macro-20260804
-->
<style>
  :root{--bg:#000;--surface:#1d1d1f;--border:rgba(255,255,255,.14);--text:#f5f5f7;--dim:#a1a1a6;--gold:#e0a526;--gold-d:#b8860b;--sans:-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC','Microsoft JhengHei','Segoe UI',sans-serif;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.7;-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none}
  /* 密碼閘 */
  #gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .gate-card{width:100%;max-width:400px;border:1.5px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(135deg,var(--gold),var(--gold-d)) border-box;border-radius:16px;padding:32px}
  .gate-card h1{font-size:20px;margin-bottom:8px}
  .gate-card p{font-size:13px;color:var(--dim);margin-bottom:20px;line-height:1.65}
  .gate-card input{width:100%;padding:12px 14px;font-size:16px;border-radius:10px;border:1px solid var(--border);background:#000;color:var(--text);margin-bottom:12px;outline:none}
  .gate-card input:focus{border-color:var(--gold)}
  .pw-wrap{position:relative;margin-bottom:12px}
  .pw-wrap input{margin-bottom:0;padding-right:46px}
  .gate-card .pw-eye{position:absolute;right:6px;left:auto;top:50%;transform:translateY(-50%);width:auto;background:none;border:none;border-radius:0;box-shadow:none;cursor:pointer;font-size:18px;line-height:1;opacity:.55;padding:6px}
  .pw-eye:hover{opacity:1}
  .gate-card button{width:100%;padding:12px;font-size:16px;font-weight:700;color:#1a1200;background:linear-gradient(135deg,var(--gold),var(--gold-d));border:none;border-radius:9999px;cursor:pointer}
  .gate-card button:disabled{opacity:.6;cursor:default}
  .gate-msg{font-size:13px;color:#ff6b6b;margin-top:12px;min-height:18px;text-align:center}
  /* 正文容器 + 浮水印 */
  #content{display:none}
  #content iframe{width:100%;border:none;display:block;min-height:100vh;background:#000}
  #wm{display:none;position:fixed;inset:0;z-index:9998;pointer-events:none;background-repeat:repeat}
</style>
</head>
<body>
  <div id="gate">
    <div class="gate-card">
      <h1>會員專屬報告</h1>
      <p>請輸入你的<b>會員 email 與密碼</b>。內容為個人專屬——每份報告都有你的浮水印，請勿外流。</p>
      <input id="email" type="email" placeholder="你的會員 email" autocomplete="email" />
      <div class="pw-wrap">
        <input id="pw" type="password" placeholder="會員密碼" autocomplete="off" />
        <button type="button" class="pw-eye" id="pwEye" aria-label="顯示或隱藏密碼">👁</button>
      </div>
      <button id="go">開啟報告</button>
      <div class="gate-msg" id="msg"></div>
    </div>
  </div>

  <div id="wm"></div>
  <div id="content"></div>

<script>
  // ★ 換成你部署 GAS 後拿到的 Web App URL（/exec 結尾）
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbwQQ02EzseXtzvHxH3yegvgvQKncv7ReoGaqqsVxzco6cdagOCW13Tr7KlwX2UJtPc7/exec';

  var reportId = new URLSearchParams(location.search).get('id') || '';
  // 裝置指紋（GAS 讀不到真 IP，用這個當「不同裝置」訊號，抓密碼共用）
  var device = localStorage.getItem('yoda_dev') || (function(){var d='D'+Math.random().toString(36).slice(2,12);localStorage.setItem('yoda_dev',d);return d;})();

  var em=document.getElementById('email'), pw=document.getElementById('pw'), go=document.getElementById('go'), msg=document.getElementById('msg');
  go.onclick=submit;
  em.addEventListener('keydown',function(e){if(e.key==='Enter')submit();});
  pw.addEventListener('keydown',function(e){if(e.key==='Enter')submit();});
  document.getElementById('pwEye').addEventListener('click',function(){
    if(pw.type==='password'){pw.type='text';this.textContent='🙈';}
    else{pw.type='password';this.textContent='👁';}
  });

  // ── 開報告：優先用「票(JWT)」打 Vercel(~1秒)；沒票/票失效才回 GAS 登入發票。──
  var API='https://yoda-research-next.vercel.app';
  function getTok(){ try{return localStorage.getItem('yoda_jwt')||'';}catch(e){return '';} }
  function setTok(t){ try{localStorage.setItem('yoda_jwt',t||'');}catch(e){} }
  function clearTok(){ try{localStorage.removeItem('yoda_jwt');}catch(e){} }

  // 打 GAS(登入發票用·附逾時重試)：GAS 較慢，只在沒有效票時做一次。
  function gasFetch(payload){
    var attempts=3, timeoutMs=30000;
    return new Promise(function(resolve,reject){
      (function run(n){
        var ctrl=('AbortController' in window)?new AbortController():null;
        var timer=ctrl?setTimeout(function(){ctrl.abort();},timeoutMs):null;
        fetch(GAS_URL,{method:'POST',body:JSON.stringify(payload),signal:ctrl?ctrl.signal:undefined})
          .then(function(r){return r.json();})
          .then(function(res){ if(timer)clearTimeout(timer); resolve(res); })
          .catch(function(e){ if(timer)clearTimeout(timer);
            if(n<attempts){ try{msg.style.color='var(--dim)';msg.textContent='驗證中…（重試 '+n+'/'+(attempts-1)+'）';}catch(_){}
              setTimeout(function(){run(n+1);}, 1500*n); } else reject(e); });
      })(1);
    });
  }
  // 帶票打 Vercel 開報告(附逾時重試)。
  function vercelReport(token){
    var attempts=3, timeoutMs=30000;
    return new Promise(function(resolve,reject){
      (function run(n){
        var ctrl=('AbortController' in window)?new AbortController():null;
        var timer=ctrl?setTimeout(function(){ctrl.abort();},timeoutMs):null;
        fetch(API+'/api/report',{method:'POST',body:JSON.stringify({token:token,reportId:reportId})})
          .then(function(r){return r.json();})
          .then(function(res){ if(timer)clearTimeout(timer); resolve(res); })
          .catch(function(e){ if(timer)clearTimeout(timer);
            if(n<attempts){ try{msg.style.color='var(--dim)';msg.textContent='載入中…（'+n+'/'+(attempts-1)+'）';}catch(_){}
              setTimeout(function(){run(n+1);},1200*n); } else reject(e); });
      })(1);
    });
  }
  // 處理 Vercel 回應：成功 render→回 true；票失效→回 false 讓外層改走登入。
  function handleReport(res){
    if(res && res.allow && res.html){ render(res.html, res.watermark); logOpenPing(res.memberId); return true; }
    if(res && res.allow && res.error){ msg.style.color='#ff6b6b'; msg.textContent=res.error; return true; } // 例:找不到這份報告
    return false;
  }
  // 開報告成功→回寫一筆開啟給 GAS(OpenLog)。fire-and-forget，不拖慢；GAS 端驗 pub 為真會員才記。
  function logOpenPing(pub){ try{ fetch('https://script.google.com/macros/s/AKfycbwQQ02EzseXtzvHxH3yegvgvQKncv7ReoGaqqsVxzco6cdagOCW13Tr7KlwX2UJtPc7/exec',{method:'POST',body:JSON.stringify({action:'logOpenPub',pub:pub||'',reportId:reportId})}); }catch(e){} }
  // GAS 登入發票（拿票存起來）→ 回 token 或 null。
  function doLogin(email, pw){
    go.disabled=true; msg.style.color='var(--dim)'; msg.textContent='驗證中…';
    return fetch(API+'/api/member-login',{method:'POST',body:JSON.stringify({email:email,password:pw})}).then(function(r){return r.json();}).then(function(res){
      go.disabled=false;
      if(!res.allow){
        if(res.reason==='need-email'){ msg.style.color='#ff6b6b'; msg.textContent=res.error||'請一併輸入你的會員 email'; if(em)em.focus(); return null; }
        clearTok();
        try{if(sessionStorage.getItem('yoda_mpw')===pw)sessionStorage.removeItem('yoda_mpw');}catch(e){}
        try{var hh=JSON.parse(localStorage.getItem('yoda_mpw_h')||'null'); if(hh&&hh.p===pw)localStorage.removeItem('yoda_mpw_h');}catch(e){}
        msg.style.color='#ff6b6b'; msg.textContent=res.error||'email 或密碼不正確，或訂閱已失效'; return null;
      }
      setTok(res.token);
      try{sessionStorage.setItem('yoda_mpw',pw);}catch(e){}
      try{localStorage.setItem('yoda_mpw_h',JSON.stringify({e:email,p:pw}));}catch(e){}
      return res.token;
    });
  }
  // 手動登入送出
  function submit(){
    var email=(em.value||'').trim(), v=(pw.value||'').trim();
    if(!v){msg.style.color='#ff6b6b';msg.textContent='請輸入密碼';return;}
    doLogin(email,v).then(function(tok){
      if(!tok) return;
      msg.style.color='var(--dim)'; msg.textContent='載入中…';
      return vercelReport(tok).then(function(res){ if(!handleReport(res)){ clearTok(); msg.style.color='#ff6b6b'; msg.textContent='請重新登入'; } });
    }).catch(function(){ go.disabled=false; msg.style.color='#ff6b6b'; msg.textContent='伺服器忙碌，請再按一次「開啟報告」'; });
  }
  // 進頁：有票先用票(快)；票失效/沒票但有交棒密碼→自動登入；再不行→停在登入框。
  (function(){
    var tok=getTok();
    var e='', p=sessionStorage.getItem('yoda_mpw')||'';
    try{ var h=localStorage.getItem('yoda_mpw_h'); if(h){ var o=JSON.parse(h); if(o){ if(o.e)e=o.e; if(!p&&o.p)p=o.p; } } }catch(_){}
    if(e)em.value=e; if(p)pw.value=p;
    if(!reportId) return;
    function loginThenOpen(){ if(!p) return; doLogin(e,p).then(function(t){ if(t) vercelReport(t).then(function(r){ if(!handleReport(r)){ msg.style.color='#ff6b6b'; msg.textContent='請重新登入'; } }); }); }
    if(tok){
      msg.style.color='var(--dim)'; msg.textContent='載入中…';
      vercelReport(tok).then(function(res){ if(handleReport(res)) return; loginThenOpen(); })
        .catch(function(){ msg.style.color='#ff6b6b'; msg.textContent='伺服器忙碌，請按「開啟報告」'; });
    } else { loginThenOpen(); }
  })();

  function render(html, watermark){
    document.getElementById('gate').style.display='none';
    // 把防盜 script 也注進報告內文（iframe 內部一起擋右鍵/複製）
    var guard='<scr'+'ipt>["contextmenu","copy","cut","selectstart","dragstart"].forEach(function(ev){document.addEventListener(ev,function(e){e.preventDefault();return false;},{passive:false});});</scr'+'ipt>'
    // 錨點修復（2026-08-18）：srcdoc iframe 的文件 URL 是 about:srcdoc，
    // 點 <a href="#sec-x"> 會被解析成 about:srcdoc#sec-x → 瀏覽器直接放棄＝左側 NAV 完全沒反應。
    // 解法：攔截同頁錨點，改用 scrollIntoView 自己捲。
      +'<scr'+'ipt>document.addEventListener("click",function(e){'
      +'var a=e.target&&e.target.closest?e.target.closest(\'a[href^="#"]\'):null;if(!a)return;'
      +'var id=a.getAttribute("href").slice(1);if(!id)return;'
      +'var el=document.getElementById(id)||document.querySelector(\'[name="\'+id+\'"]\');'
      +'if(!el)return;e.preventDefault();'
      +'try{el.scrollIntoView({behavior:"smooth",block:"start"});}catch(_){el.scrollIntoView();}'
      +'},true);</scr'+'ipt>';
    var f=document.createElement('iframe');
    f.setAttribute('sandbox','allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox'); // allow-scripts:圖表JS；allow-popups(+escape):遊戲鈕/粉專等 target=_blank 能開新分頁(不然沙箱擋掉=點了沒反應)
    // ── 右側捲軸：注進 iframe（2026-08-29 讀者反映 · core-render §B-32）──────────────
    // 為什麼要在殼層做，而不是只修母板：付費報告的正文是從後端（Drive／Blob）拿的，
    // 已經上傳的舊檔裡帶著 `::-webkit-scrollbar{display:none!important}`——
    // 修母板只對「之後新產的」有效，救不了雲端上那幾十份舊的。
    // 在這裡注入＝不管報告是哪一版、存在哪裡，捲軸都一定看得見（用 !important 蓋過舊規則）。
    f.addEventListener('load', function(){
      try{
        var d=f.contentDocument; if(!d) return;
        var st=d.createElement('style');
        st.textContent=
          'html{overflow-y:scroll!important;scrollbar-width:auto!important;scrollbar-color:rgba(140,162,186,.62) transparent!important}'
         +'*::-webkit-scrollbar{display:block!important;width:8px!important;height:8px!important}'
         +'html::-webkit-scrollbar,body::-webkit-scrollbar{display:block!important;width:13px!important;height:13px!important}'
         +'html::-webkit-scrollbar-track,body::-webkit-scrollbar-track{background:rgba(128,150,175,.10)!important}'
         +'html::-webkit-scrollbar-thumb,body::-webkit-scrollbar-thumb{background:rgba(140,162,186,.62)!important;border-radius:8px!important;border:3px solid transparent!important;background-clip:content-box!important}'
         +'html::-webkit-scrollbar-thumb:hover,body::-webkit-scrollbar-thumb:hover{background:rgba(175,196,218,.88)!important;background-clip:content-box!important}'
         +'*::-webkit-scrollbar-thumb{background:rgba(140,162,186,.5)!important;border-radius:5px!important}';
        (d.head||d.documentElement).appendChild(st);
      }catch(e){}
    });
    f.srcdoc=guard+html;                                          // 正文從後端來，靜態檔裡沒有
    var c=document.getElementById('content');
    c.appendChild(f); c.style.display='block';
    setWatermark(watermark||'Yoda Research');
  }

  function setWatermark(text){
    var t=String(text).replace(/[<>&]/g,'');
    var svg='<svg xmlns="http://www.w3.org/2000/svg" width="278" height="180">'
      +'<text x="14" y="98" fill="rgba(255,255,255,0.05)" font-size="14" font-family="sans-serif" transform="rotate(-28 139 90)">'+t+'</text></svg>';
    var wm=document.getElementById('wm');
    wm.style.backgroundImage='url("data:image/svg+xml;utf8,'+encodeURIComponent(svg)+'")';
    wm.style.display='block';
  }

  // 空殼本身也擋右鍵/複製
  ['contextmenu','copy','cut','selectstart','dragstart'].forEach(function(ev){
    document.addEventListener(ev,function(e){e.preventDefault();return false;},{passive:false});
  });
</script>
<!-- 平板以上提示（手機置中·點擊關閉·記憶）自包含注入片段 -->
<script>
(function(){
  try{if(localStorage.getItem('hideTabletHint')==='1')return;}catch(e){}
  if(document.querySelector('.tablet-hint'))return;
  var css='@media(min-width:768px){.tablet-hint{display:none!important}}'
    +'.tablet-hint{position:fixed;inset:0;z-index:99998;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(4,6,10,.72);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}'
    +'.tablet-hint .th-card{max-width:320px;width:100%;background:#12100a;border:1px solid #3a3320;border-radius:16px;padding:26px 24px;text-align:center;box-shadow:0 14px 44px rgba(0,0,0,.55)}'
    +'.tablet-hint .th-ico{font-size:34px;margin-bottom:12px}'
    +'.tablet-hint .th-t{font-size:17px;font-weight:700;color:#e8c877;margin-bottom:8px;line-height:1.5}'
    +'.tablet-hint .th-s{font-size:13px;color:#b8b09a;line-height:1.7;margin-bottom:16px}'
    +'.tablet-hint .th-x-btn{margin-top:8px;font-family:inherit;font-size:13px;font-weight:700;color:#1a1200;background:#e8c877;border:none;border-radius:10px;padding:10px 22px;cursor:pointer}.tablet-hint .th-x-btn:active{opacity:.85}';
  var st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  var ov=document.createElement('div');ov.className='tablet-hint';
  ov.innerHTML='<div class="th-card"><div class="th-ico">📱 → 💻</div><div class="th-t">建議使用平板以上</div><div class="th-s">這份報告資訊密度高，用平板或電腦看，版面才展得開、體驗最佳。手機也能看，只是較擠。</div><button class="th-x-btn" type="button">知道了，繼續看</button></div>';
  function close(){try{localStorage.setItem('hideTabletHint','1');}catch(e){}if(ov.parentNode)ov.parentNode.removeChild(ov);}
  var _thb=ov.querySelector('.th-x-btn');if(_thb)_thb.addEventListener('click',close);
  if(document.body)document.body.appendChild(ov);else document.addEventListener('DOMContentLoaded',function(){document.body.appendChild(ov);});
})();
</script>
<script src="https://yoda-research-next.vercel.app/yoda-install.js" defer></script>
<script>(function(){try{var K='yr_vid',v=localStorage.getItem(K);if(!v){v=Date.now().toString(36)+Math.random().toString(36).slice(2,8);localStorage.setItem(K,v);}var seg=location.pathname.split('/').filter(Boolean).pop()||'home';fetch('https://script.google.com/macros/s/AKfycbwQQ02EzseXtzvHxH3yegvgvQKncv7ReoGaqqsVxzco6cdagOCW13Tr7KlwX2UJtPc7/exec',{method:'POST',body:JSON.stringify({action:'hit',page:decodeURIComponent(seg),path:location.pathname,host:location.hostname,ref:document.referrer,vid:v})});}catch(e){}})();</script>
<img alt="Yoda" src="https://yoda-research-next.vercel.app/yoda-logo.png" style="position:fixed;right:14px;bottom:12px;height:52px;width:auto;opacity:.5;z-index:9990;pointer-events:none">
</body>
