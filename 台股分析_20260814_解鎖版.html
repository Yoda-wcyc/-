function b2a(b64){var s=atob(b64),n=s.length,u=new Uint8Array(n);for(var i=0;i<n;i++)u[i]=s.charCodeAt(i);return u;}
var m=document.getElementById('m'), b=document.getElementById('b');

async function unlock(user,pass,quiet){
  if(!window.crypto||!window.crypto.subtle){
    m.textContent='這個瀏覽器環境不支援解密（需要 https 連線開啟）。';return false;}
  var enc=new TextEncoder();
  var base=await crypto.subtle.importKey('raw',enc.encode(user.trim().toLowerCase()+'\n'+pass),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b2a(SALT),iterations:ITER,hash:'SHA-256'},
      base,{name:'AES-GCM',length:256},false,['decrypt']);
  var plain;
  try{ plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(IV)},key,b2a(DATA)); }
  catch(e){ if(!quiet){m.className='msg';m.textContent='帳號或密碼不對，再試一次。';} return false; }
  try{ localStorage.setItem(KEY,JSON.stringify({u:user,p:pass})); }catch(e){}
  var html=new TextDecoder('utf-8').decode(plain);
  document.open(); document.write(html); document.close();
  return true;
}

document.getElementById('f').addEventListener('submit',async function(e){
  e.preventDefault();
  var u=document.getElementById('u').value, p=document.getElementById('p').value;
  if(!u||!p){m.className='msg';m.textContent='帳號和密碼都要填。';return;}
  b.disabled=true; m.className='msg ok'; m.textContent='解鎖中…';
  var ok=await unlock(u,p,false);
  if(!ok){b.disabled=false;}
});

/* 這台裝置解鎖過就自動開，不用每次重打 */
(async function(){
  try{
    var s=JSON.parse(localStorage.getItem(KEY)||'null');
    if(s&&s.u&&s.p){ m.className='msg ok'; m.textContent='解鎖中…'; await unlock(s.u,s.p,true); m.textContent=''; }
  }catch(e){}
})();
</script>
